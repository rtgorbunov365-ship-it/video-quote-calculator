<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Editor Quote Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bg: '#0f172a', card: '#1e293b', accent: '#22d3ee' }}}}
  </script>
  <style>
    @media print { .no-print { display: none !important; } body { background: white !important; color: black !important; } .bg-card { background: white !important; border: 1px solid #e2e8f0 !important; } .text-accent { color: #0891b2 !important; } .bg-accent { background: #0891b2 !important; } }
  </style>
</head>
<body class="bg-bg text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-4xl grid md:grid-cols-[1fr_320px] gap-6">
    <div class="bg-card rounded-2xl p-6 space-y-5">
      <h1 class="text-2xl font-bold tracking-tight">Video Editor Quote Generator</h1>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Тип видео</label>
          <select id="type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:border-accent focus:outline-none">
            <option value="youtube" data-mult="1">YouTube выпуск (×1.0)</option>
            <option value="reels" data-mult="1.2">Reels / TikTok / Shorts (×1.2)</option>
            <option value="ad" data-mult="1.5">Рекламный ролик (×1.5)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Базовая ставка за минуту ($)</label>
          <input id="rate" type="number" value="30" min="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:border-accent focus:outline-none">
        </div>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Длительность: <span id="durVal" class="text-accent">1</span> мин</label>
        <input id="duration" type="range" min="1" max="60" value="1" class="w-full h-2 bg-slate-700 rounded-lg appearance-none accent-accent">
      </div>
      <fieldset class="space-y-3 pt-2 border-t border-slate-800">
        <legend class="text-sm font-medium text-slate-300">Доп. услуги</legend>
        <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="subs" value="20" class="w-4 h-4 accent-accent rounded border-slate-600"><span>Динамические субтитры (+$20)</span></label>
        <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="sound" value="25" class="w-4 h-4 accent-accent rounded border-slate-600"><span>Саунд-дизайн и подбор музыки (+$25)</span></label>
        <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="rush" class="w-4 h-4 accent-accent rounded border-slate-600"><span>Срочный заказ за 24ч (+35% к итогу)</span></label>
      </fieldset>
    </div>

    <div class="bg-card rounded-2xl p-6 sticky top-4 h-fit">
      <h2 class="text-lg font-semibold mb-4">Итоговая смета</h2>
      <div id="breakdown" class="space-y-2 text-sm text-slate-300 mb-4"></div>
      <div class="border-t border-slate-700 pt-3 mb-4">
        <div class="flex justify-between text-lg font-bold"><span>Итого:</span><span id="total" class="text-accent">$30</span></div>
      </div>
      <button id="copyBtn" class="w-full bg-accent text-bg font-semibold py-3 rounded-lg hover:opacity-90 transition no-print">Скопировать смету</button>
      <p id="toast" class="text-center text-xs text-green-400 mt-2 hidden">Скопировано!</p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => '$' + n.toLocaleString();

    function calc() {
      const rate = +$('rate').value || 30;
      const dur = +$('duration').value;
      $('durVal').textContent = dur;
      const mult = +$('type').selectedOptions[0].dataset.mult;
      let base = rate * dur * mult;
      let addons = 0;
      const lines = [];

      lines.push(`База: ${dur} мин × $${rate} × ${mult} = ${fmt(base)}`);
      if ($('subs').checked) { addons += 20; lines.push('Субтитры: +$20'); }
      if ($('sound').checked) { addons += 25; lines.push('Саунд-дизайн: +$25'); }
      let subtotal = base + addons;
      if ($('rush').checked) { const rush = Math.round(subtotal * 0.35); subtotal += rush; lines.push(`Срочность (+35%): +${fmt(rush)}`); }

      $('breakdown').innerHTML = lines.map(l => `<div class="flex justify-between"><span>${l.split(':')[0]}</span><span>${l.includes('=') ? l.split('=')[1].trim() : '+' + l.split('+')[1]}</span></div>`).join('');
      $('total').textContent = fmt(subtotal);
      return { base, addons, subtotal, lines };
    }

    function copy() {
      const { lines, subtotal } = calc();
      const text = `СМЕТА НА ВИДЕОМОНТАЖ\n\n${lines.join('\n')}\n\nИТОГО: ${fmt(subtotal)}\n\nВ стоимость включены 2 раунда правок. Каждый дополнительный — по тарифу.`;
      navigator.clipboard.writeText(text);
      const t = $('toast'); t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 1500);
    }

    ['type','rate','duration','subs','sound','rush'].forEach(id => $(id).addEventListener('input', calc));
    $('rate').addEventListener('input', () => localStorage.setItem('rate', $('rate').value));
    $('rate').value = localStorage.getItem('rate') || 30;
    $('copyBtn').addEventListener('click', copy);
    calc();
  </script>
</body>
</html>
